<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заметки</title>
<style>
  :root { --bg:#f3f5f7; --ink:#1c2430; --muted:#5d6b7a; --line:#d5dbe1; --accent:#0f6e6e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 20px; }
  h1 { margin:0 0 24px; font-size:28px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; font:inherit; border:1px solid var(--line);
          border-radius:6px; background:#fff; color:inherit; }
  button { padding:10px 16px; font:inherit; font-weight:600; color:#fff;
           background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #status { min-height:1.5em; margin:12px 0; color:#a33; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:12px 0; border-top:1px solid var(--line); overflow-wrap:anywhere; }
  li time { display:block; font-size:13px; color:var(--muted); }
  .empty { color:var(--muted); }
  footer { margin-top:24px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Заметки</h1>
  <form id="form">
    <input id="text" maxlength="500" placeholder="Что записать?" required autofocus>
    <button type="submit">Сохранить</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="list"></ul>
  <footer>Ответил инстанс бэкенда: <span id="instance">—</span></footer>
</main>
<script src="config.js"></script>
<script>
  const API = window.API_BASE || "/api";
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  const statusEl = document.getElementById("status");
  const list = document.getElementById("list");
  const instanceEl = document.getElementById("instance");

  function render(notes) {
    if (!notes.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Заметок пока нет. Добавьте первую.";
      list.replaceChildren(li);
      return;
    }
    list.replaceChildren(...notes.map(n => {
      const li = document.createElement("li");
      li.textContent = n.text;               // textContent: защита от XSS
      const t = document.createElement("time");
      t.textContent = new Date(n.created_at).toLocaleString("ru-RU");
      li.append(t);
      return li;
    }));
  }

  async function load() {
    try {
      const r = await fetch(`${API}/notes`);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      render(data.notes);
      instanceEl.textContent = data.instance;
      statusEl.textContent = "";
    } catch {
      statusEl.textContent = "Не удалось загрузить заметки. Проверьте, что бэкенд запущен.";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    try {
      const r = await fetch(`${API}/notes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) throw new Error(r.status);
      input.value = "";
      await load();
    } catch {
      statusEl.textContent = "Не удалось сохранить заметку.";
    }
  });

  load();
</script>
</body>
</html>
